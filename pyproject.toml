[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "analista-pedidos-ia"
version = "0.1.0"
description = "Agente que responde perguntas de negócio sobre pedidos sintéticos de um restaurante, com SQL somente leitura."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=3.41,<4",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
painel = ["streamlit>=1.66,<2"]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[tool.setuptools]
packages = ["analista", "avaliacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
