[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analista-pedidos-ia"
version = "0.1.0"
description = "Agente que responde perguntas de negócio sobre pedidos sintéticos de um restaurante, com SQL somente leitura."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
painel = ["streamlit>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["analista", "avaliacao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
